<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Inkstar's Space | 项目与博客</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Inkstar 的个人项目展示与技术博客">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 自定义一点点样式，让它更像 csdiy.wiki */
    :root {
      --theme-color: #42b983; /* 经典的绿色主题 */
    }
    nav.app-nav {
      position: sticky;
    }
    section.cover h1 {
      font-size: 3.5rem;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Inkstar',
      repo: 'https://github.com/inkstar', // 替换成你的 GitHub 地址
      loadSidebar: true,   // 开启侧边栏
      loadNavbar: false,    // 开启顶部导航
      coverpage: true,     // 开启封面页
      subMaxLevel: 3,      // 侧边栏显示目录层级
      auto2top: true,      // 切换页面后自动回到顶部
      search: {
        placeholder: '搜索...',
        noData: '找不到结果',
        depth: 6
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>

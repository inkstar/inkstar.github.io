                </div>
            </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

                        <div class="text-3xl font-bold text-slate-800 font-mono" id="formulaDisplay">y = x<sup><span class="text-sm align-top">-6</span>/<span class="text-sm align-bottom">5</span></sup></div>
                    </div>

                    <div class="absolute bottom-6 right-6 flex flex-col gap-2 bg-white/90 backdrop-blur-sm rounded-lg shadow-sm border border-slate-200 p-2">

                            <span class="material-symbols-outlined">remove</span>

                <!-- Parameter Controls -->

    <script>
        // --- State Management ---
        const state = {
            a: 1,
            b: 1,
            scale: 40, // pixels per unit
            offsetX: 0,
            offsetY: 0,
            points: [], // Array of {x, y, id}
            canvas: null,
            ctx: null,
            width: 0,
            height: 0
        };

        // --- Math Logic ---

        /**
         * Calculates Greatest Common Divisor
         */
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        /**
         * Simplifies fraction and handles negative signs
         * Returns {n: numerator, d: denominator} in simplest form with positive denominator
         */
        function simplifyFraction(num, den) {
            if (den === 0) return null; // Should be handled by UI validation
            
            // Handle signs
            let sign = 1;
            if (num < 0) { sign *= -1; num = -num; }
            if (den < 0) { sign *= -1; den = -den; }
            
            const common = gcd(num, den);
            return {
                n: (num / common) * sign,
                d: den / common
            };
        }

        /**
         * Calculates y = x^(n/d) robustly for real numbers
         */
        function calculateY(x, n, d) {
            // Case 1: x = 0
            if (Math.abs(x) < 1e-10) {
                if (n === 0) return 1; // 0^0 is debatable, often 1 in computing limits
                return (n > 0) ? 0 : Infinity; // 0^(positive) = 0, 0^(negative) = Inf
            }

            const exponent = n / d;

            // Case 2: x > 0
            if (x > 0) {
                return Math.pow(x, exponent);
            }

            // Case 3: x < 0
            // x^(n/d) = (root(x, d))^n
            // Even denominator root of negative number is complex (NaN in Real plot)
            if (Math.abs(d) % 2 === 0) {
                return NaN;
            }

            // Odd denominator is fine. 
            // Result sign depends on whether numerator is even or odd.
            // (-x)^(n/d) -> sign determined by n
            // e.g. (-8)^(2/3) -> (cube_root(-8))^2 -> (-2)^2 = 4 (positive)
            // e.g. (-8)^(1/3) -> -2 (negative)
            
            let baseResult = Math.pow(Math.abs(x), exponent);
            
            // If numerator is odd, the negative sign is preserved
            if (Math.abs(n) % 2 !== 0) {
                return -baseResult;
            } else {
                return baseResult;
            }
        }

        /**
         * Generates the formula string for display
         */
        function getFormulaHTML(a, b) {
            const simple = simplifyFraction(a, b);
            if (!simple) return "undefined";
            
            const { n, d } = simple;

            if (d === 1) {
                return `y = x<sup>${n}</sup>`;
            }
            // Pretty format for negative exponents if desired, but x^(-2/3) is standard
            return `y = x<sup><span class="text-sm align-top">${n}</span>/<span class="text-sm align-bottom">${d}</span></sup>`;
        }

        // --- Canvas Drawing ---

        function initCanvas() {
            state.canvas = document.getElementById('functionCanvas');
            state.ctx = state.canvas.getContext('2d');
            
            // Handle resizing
            const resizeObserver = new ResizeObserver(() => {
                resizeCanvas();
                draw();
            });
            resizeObserver.observe(state.canvas.parentElement);
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = state.canvas.parentElement.getBoundingClientRect();
            state.width = rect.width;
            state.height = rect.height;
            
            // High DPI support
            const dpr = window.devicePixelRatio || 1;
            state.canvas.width = state.width * dpr;
            state.canvas.height = state.height * dpr;
            state.ctx.scale(dpr, dpr);
            
            // Center origin by default if not panned (Simple version: always center)
            state.offsetX = state.width / 2;
            state.offsetY = state.height / 2;
            
            draw();
        }

        function toCanvasX(mathX) {
            return state.offsetX + mathX * state.scale;
        }

        function toCanvasY(mathY) {
            return state.offsetY - mathY * state.scale; // Y axis flipped
        }

        function toMathX(canvasX) {
            return (canvasX - state.offsetX) / state.scale;
        }

        function drawGrid() {
            const ctx = state.ctx;
            const w = state.width;
            const h = state.height;
            
            ctx.clearRect(0, 0, w, h);
            
            // Grid style
            ctx.strokeStyle = '#e2e8f0'; // slate-200
            ctx.lineWidth = 1;
            ctx.beginPath();

            // Vertical lines
            // Find first integer line on left
            const startX = Math.floor(toMathX(0));
            const endX = Math.ceil(toMathX(w));
            
            for(let i = startX; i <= endX; i++) {
                const cx = toCanvasX(i);
                ctx.moveTo(cx, 0);
                ctx.lineTo(cx, h);
            }

            // Horizontal lines
            const startY = Math.floor((state.offsetY - h) / state.scale); // Approximate
            const endY = Math.ceil(state.offsetY / state.scale); 
            
            // Simple approach for Y range:
            // MathY at top is (offsetY)/scale (actually positive)
            // MathY at bottom is (offsetY - h)/scale (negative)
            const mathYMax = state.offsetY / state.scale;
            const mathYMin = (state.offsetY - h) / state.scale;

            for(let i = Math.floor(mathYMin); i <= Math.ceil(mathYMax); i++) {
                const cy = toCanvasY(i);
                ctx.moveTo(0, cy);
                ctx.lineTo(w, cy);
            }
            ctx.stroke();

            // Axes
            ctx.strokeStyle = '#64748b'; // slate-500
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            // X Axis
            if (state.offsetY >= 0 && state.offsetY <= h) {
                ctx.moveTo(0, state.offsetY);
                ctx.lineTo(w, state.offsetY);
            }
            
            // Y Axis
            if (state.offsetX >= 0 && state.offsetX <= w) {
                ctx.moveTo(state.offsetX, 0);
                ctx.lineTo(state.offsetX, h);
            }
            ctx.stroke();

            // Numbers
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            // X labels
            for(let i = startX; i <= endX; i++) {
                if(i === 0) continue;
                // Only draw if enough space
                if (state.scale > 30 || i % 5 === 0) {
                   ctx.fillText(i, toCanvasX(i), state.offsetY + 5);
                }
            }
            
            // Y labels
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for(let i = Math.floor(mathYMin); i <= Math.ceil(mathYMax); i++) {
                if(i === 0) continue;
                if (state.scale > 30 || i % 5 === 0) {
                    ctx.fillText(i, state.offsetX - 5, toCanvasY(i));
                }
            }
            
            // Origin
            ctx.fillText("0", state.offsetX - 5, state.offsetY + 5);
        }

        function drawCurve() {
            const ctx = state.ctx;
            const w = state.width;
            
            const simple = simplifyFraction(state.a, state.b);
            if (!simple) return; // Divide by zero case
            
            const { n, d } = simple;

            ctx.strokeStyle = '#2563eb'; // blue-600
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.beginPath();

            let firstPoint = true;
            
            // Step size in pixels
            const pixelStep = 2; 
            
            for (let px = 0; px <= w; px += pixelStep) {
                const mathX = toMathX(px);
                const mathY = calculateY(mathX, n, d);

                // Handle undefined/infinity
                if (isNaN(mathY) || !isFinite(mathY)) {
                    firstPoint = true;
                    continue;
                }

                const py = toCanvasY(mathY);
                
                // Avoid drawing lines across infinity/asymptotes 
                // Simple heuristic: if jump is too big, break line
                // However, vertical asymptotes near 0 need care.
                
                if (firstPoint) {
                    ctx.moveTo(px, py);
                    firstPoint = false;
                } else {
                    // Check for vertical discontinuity
                    // Using current point (px, py) and previous would require storing prev
                    // Let's just limit the drawing capability to canvas bounds roughly
                    // If y is insanely large, don't draw line TO it if it crosses bounds excessively
                    
                    // Basic bounds check to prevent canvas rendering artifacts with huge coords
                    const MAX_COORD = 10000; 
                    if (py < -MAX_COORD || py > MAX_COORD) {
                         ctx.moveTo(px, py); // Move instead of line to skip visualization of "infinity lines"
                    } else {
                        // Check slope to detect asymptotes
                        // If we are connecting points that span the entire screen vertically in 1 step, probably an asymptote
                        /* Complex to do perfectly, simple moveTo is usually enough for visualizer */
                        
                        // Just draw for now
                        ctx.lineTo(px, py);
                    }
                }
            }
            ctx.stroke();
        }

        function drawUserPoints() {
            const ctx = state.ctx;
            
            state.points.forEach(p => {
                // Check if p.y is valid
                if(isNaN(p.y) || !isFinite(p.y)) return;

                const cx = toCanvasX(p.x);
                const cy = toCanvasY(p.y);

                // Check visibility
                if (cx < -10 || cx > state.width + 10 || cy < -10 || cy > state.height + 10) return;

                // Draw Point
                ctx.beginPath();
                ctx.arc(cx, cy, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444'; // red-500
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Label
                ctx.fillStyle = '#1e293b'; // slate-800
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                // Adjust label position based on location
                ctx.fillText(`(${p.x}, ${p.f_x_formatted})`, cx, cy - 10);
            });
        }

        function draw() {
            drawGrid();
            drawCurve();
            drawUserPoints();
        }

        // --- Interaction Logic ---

        function updateParams() {
            // Get values
            let valA = parseInt(document.getElementById('inputA').value) || 0;
            let valB = parseInt(document.getElementById('inputB').value);

            // Validation
            const errB = document.getElementById('errorB');
            if (isNaN(valB) || valB === 0) {
                errB.classList.remove('hidden');
                return; // Stop update
            } else {
                errB.classList.add('hidden');
            }

            state.a = valA;
            state.b = valB;

            // Sync Sliders
            document.getElementById('sliderA').value = valA;
            document.getElementById('sliderB').value = valB;
            
            // Sync Display Text
            document.getElementById('valA').innerText = valA;
            document.getElementById('valB').innerText = valB;

            // Update Formula
            document.getElementById('formulaDisplay').innerHTML = getFormulaHTML(state.a, state.b);

            // Re-calculate points in table because function changed
            recalculateAllPoints();

            draw();
        }

        function handleInput(type, source) {
            const inputEl = document.getElementById(`input${type}`);
            const sliderEl = document.getElementById(`slider${type}`);
            
            if (source === 'slider') {
                inputEl.value = sliderEl.value;
            } else {
                // If typed, don't necessarily update slider immediately if out of range, 
                // but we accept the value.
                // Optionally clamp slider visual only
                let val = parseInt(inputEl.value);
                if (val >= -10 && val <= 10) sliderEl.value = val;
            }
            updateParams();
        }

        function adjustZoom(factor) {
            state.scale *= factor;
            // Clamp scale
            if (state.scale < 5) state.scale = 5;
            if (state.scale > 500) state.scale = 500;
            draw();
        }

        function resetZoom() {
            state.scale = 40;
            draw();
        }

        // --- Table & Calculation Logic ---

        function formatNumber(num) {
            if (Number.isInteger(num)) return num.toString();
            return num.toFixed(4).replace(/\.?0+$/, ''); // Max 4 decimals, trim zeros
        }

        function calculatePoint() {
            const xInput = document.getElementById('inputX');
            const xVal = parseFloat(xInput.value);
            
            if (isNaN(xVal)) return;

            const simple = simplifyFraction(state.a, state.b);
            if (!simple) return;

            const yVal = calculateY(xVal, simple.n, simple.d);
            
            let displayY = "未定义";
            let rawY = NaN;
            
            if (!isNaN(yVal) && isFinite(yVal)) {
                displayY = formatNumber(yVal);
                rawY = yVal;
            } else if (!isFinite(yVal) && !isNaN(yVal)) {
                 displayY = "∞";
            }

            // Add to state
            const pointData = {
                id: Date.now(),
                x: xVal,
                y: rawY,
                f_x_formatted: displayY
            };
            
            state.points.push(pointData);
            
            addTableRow(pointData);
            draw();
            
            // Clear input for UX? No, keep it for modifications usually. 
            // xInput.value = ''; 
            xInput.focus();
        }

        function recalculateAllPoints() {
            const simple = simplifyFraction(state.a, state.b);
            if (!simple) return;

            state.points = state.points.map(p => {
                const yVal = calculateY(p.x, simple.n, simple.d);
                let displayY = "未定义";
                let rawY = NaN;
                
                if (!isNaN(yVal) && isFinite(yVal)) {
                    displayY = formatNumber(yVal);
                    rawY = yVal;
                } else if (!isFinite(yVal) && !isNaN(yVal)) {
                    displayY = "∞";
                }
                
                return { ...p, y: rawY, f_x_formatted: displayY };
            });

            // Rebuild Table UI
            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = '';
            
            if (state.points.length === 0) {
                 const emptyRow = document.createElement('tr');
                 emptyRow.id = "emptyRow";
                 emptyRow.className = "table w-full table-fixed";
                 emptyRow.innerHTML = `<td colspan="3" class="px-4 py-8 text-center text-slate-400 italic">输入 x 并点击计算以添加数据点</td>`;
                 tbody.appendChild(emptyRow);
            } else {
                 state.points.forEach(p => addTableRow(p, false));
            }
        }

        function addTableRow(point, append = true) {
            const tbody = document.getElementById('resultTableBody');
            
            // Remove empty row text if exists
            const emptyRow = document.getElementById('emptyRow');
            if (emptyRow) emptyRow.remove();

            const tr = document.createElement('tr');
            tr.className = "table w-full table-fixed animate-[fadeIn_0.3s_ease-out]";
            tr.innerHTML = `
                <td class="px-4 py-3 border-b border-slate-50 font-mono text-slate-700">${point.x}</td>
                <td class="px-4 py-3 border-b border-slate-50 font-mono font-bold text-blue-600">${point.f_x_formatted}</td>
                <td class="px-2 py-3 border-b border-slate-50 text-right">
                    <button onclick="removePoint(${point.id})" class="text-slate-400 hover:text-red-500 transition-colors p-1 rounded-full hover:bg-red-50">
                        <span class="material-symbols-outlined text-lg">close</span>
                    </button>
                </td>
            `;

            if (append) {
                tbody.insertBefore(tr, tbody.firstChild); // Prepend for latest on top
            } else {
                tbody.appendChild(tr);
            }
        }

        function removePoint(id) {
            state.points = state.points.filter(p => p.id !== id);
            recalculateAllPoints(); // simplest way to refresh UI correctly
            draw();
        }

        function clearTable() {
            state.points = [];
            recalculateAllPoints();
            draw();
        }

        // --- Event Listeners ---
        
        document.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            updateParams(); // Initial draw

            // Input A
            document.getElementById('inputA').addEventListener('input', () => handleInput('A', 'input'));
            document.getElementById('sliderA').addEventListener('input', () => handleInput('A', 'slider'));

            // Input B
            document.getElementById('inputB').addEventListener('input', () => handleInput('B', 'input'));
            document.getElementById('sliderB').addEventListener('input', () => handleInput('B', 'slider'));

            // Input X Enter Key
            document.getElementById('inputX').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculatePoint();
            });
        });

    </script>
